name: Go static checks

on:
  pull_request:
    branches: [preview]
    paths:
      - '智慧养老手表管理系统/backend/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-static-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-static:
    name: Go static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: '智慧养老手表管理系统/backend/go.sum'

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck=

      - name: Verify formatting and vet
        working-directory: '智慧养老手表管理系统/backend'
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l ./cmd ./internal ./migrations)"
          if [ -n "$unformatted" ]; then
            printf 'Go files requiring gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
          go vet ./...
