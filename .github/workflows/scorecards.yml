name: OpenSSF Scorecard

on:
  push:
    branches: [preview]
    paths:
      - ".github/**"
      - "智慧养老手表管理系统/oldIot/package.json"
      - "智慧养老手表管理系统/oldIot/package-lock.json"
      - "智慧养老手表管理系统/careold/pom.xml"
      - "智慧养老手表管理系统/desktop/**"
  workflow_dispatch:

# Keep workflow-level permissions read-only. Results are intentionally not
# published to the public Scorecard API while this workflow lives only on the
# non-default preview branch.
permissions: read-all

concurrency:
  group: scorecard-preview
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 7

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
