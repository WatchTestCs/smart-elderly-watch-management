name: PR108 final Go format and compile

on:
  push:
    branches: [refactor/preview-ts-scopes-20261107]
    paths: [.github/workflows/pr108-format-final-once.yml]

permissions:
  contents: write

jobs:
  format-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/preview-ts-scopes-20261107
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: 智慧养老手表管理系统/backend/go.sum
      - name: Format current backend and push only existing PR branch
        working-directory: 智慧养老手表管理系统/backend
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal ./migrations
          git add cmd internal migrations
          if ! git diff --cached --quiet; then
            git config user.name github-actions
            git config user.email github-actions@users.noreply.github.com
            git commit -m 'style(go): format family and health domain extraction'
            git push origin HEAD:refs/heads/refactor/preview-ts-scopes-20261107
          fi
          test -z "$(gofmt -l ./cmd ./internal ./migrations)"
      - name: Compile and vet the current backend
        working-directory: 智慧养老手表管理系统/backend
        run: |
          go test -run '^$' ./...
          go vet ./...
      - name: Test affected repositories
        working-directory: 智慧养老手表管理系统/backend
        run: |
          go test ./internal/familyrepo ./internal/health ./internal/telemetryrepo ./internal/careworkflow ./internal/notify
