name: Exact-source release evidence
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      source_branch:
        required: false
        type: string
        default: preview
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: ${{ github.ref == format('refs/heads/{0}', inputs.source_branch) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Require current source branch and SHA-bound successful evidence
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 scripts/reliability/release-gate.py --repo "$REPOSITORY" --branch "$SOURCE_BRANCH" --sha "$SOURCE_SHA" --output release-provenance.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-provenance-${{ inputs.source_sha }}
          path: release-provenance.json
          if-no-files-found: error
