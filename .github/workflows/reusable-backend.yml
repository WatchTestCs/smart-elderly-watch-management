# CI-only service container: these ephemeral runner credentials are never shared with production.
name: Reusable backend verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Test, build and vet (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.10", "1.27.2"]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: suining_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pci_root_only --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: careold
          POSTGRES_PASSWORD: careold
          POSTGRES_DB: careold_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careold -d careold_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: 智慧养老手表管理系统/backend/go.sum

      - name: Enforce native Go API boundary
        run: python3 scripts/check-api-boundary.py

      - name: Check generated OpenAPI contract
        run: python3 scripts/generate-openapi.py --check

      - name: Start private real S3-compatible integration server
        run: |
          cat > "$RUNNER_TEMP/s3-test.json" <<'JSON'
          {"identities":[{"name":"ci-only","credentials":[{"accessKey":"ci-only-access","secretKey":"ci-only-not-production-secret-key"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
          JSON
          docker run -d --name s3-integration -p 127.0.0.1:8333:8333 \
            -v "$RUNNER_TEMP/s3-test.json:/etc/s3-test.json:ro" \
            chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8 mini -dir=/data -ip.bind=0.0.0.0 \
            -admin.ui=false -volume.max=2 -bucket=care-ci -s3.config=/etc/s3-test.json
          for attempt in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/care-ci || true)"
            if [ "$code" = 403 ] || [ "$code" = 401 ]; then exit 0; fi
            sleep 1
          done
          docker logs s3-integration
          exit 1

      - name: Run backend tests, build and vet
        working-directory: 智慧养老手表管理系统/backend
        env:
          TEST_MYSQL_DSN: root:ci_root_only@tcp(localhost:3306)/suining_test
          TEST_DATABASE_URL: postgres://careold:careold@localhost:5432/careold_test?sslmode=disable
          TEST_S3_ENDPOINT: http://127.0.0.1:8333
          TEST_S3_BUCKET: care-ci
          TEST_S3_ACCESS_KEY: ci-only-access
          TEST_S3_SECRET_KEY: ci-only-not-production-secret-key
        run: |
          set -euo pipefail
          mkdir -p ../../evidence/ci/backend-${{ matrix.go-version }}
          evidence=../../evidence/ci/backend-${{ matrix.go-version }}
          test -n "$TEST_MYSQL_DSN" && test -n "$TEST_DATABASE_URL"
          git rev-parse HEAD > "$evidence/source-sha.txt"
          go version > "$evidence/go-version.txt"
          go env GOOS GOARCH CGO_ENABLED >> "$evidence/go-version.txt"
          MYSQL_PWD=ci_root_only mysql --protocol=TCP -h 127.0.0.1 -u root -N -e 'SELECT VERSION(),@@innodb_flush_log_at_trx_commit,@@version_comment' > "$evidence/mysql-environment.txt"
          PGPASSWORD=careold psql -h 127.0.0.1 -U careold -d careold_test -Atc 'SELECT version(); SHOW fsync;' > "$evidence/postgres-environment.txt"
          docker inspect --format '{{.Config.Image}} {{.Image}}' '${{ job.services.mysql.id }}' '${{ job.services.postgres.id }}' > "$evidence/database-images.txt"
          go list -m -json all > "$evidence/modules.jsonl"
          go test -json -race -count=1 -timeout 600s ./... > "$evidence/mysql.jsonl" 2>&1
          python3 ../../scripts/reliability/audit-go-results.py "$evidence/mysql.jsonl" --mode mysql --output "$evidence/mysql-summary.json"
          TEST_MYSQL_DSN= go test -json -race -count=1 -timeout 600s ./internal/db ./internal/handlers ./internal/care ./internal/analytics > "$evidence/postgres.jsonl" 2>&1
          python3 ../../scripts/reliability/audit-go-results.py "$evidence/postgres.jsonl" --mode postgres --output "$evidence/postgres-summary.json"
          go build ./... > "$evidence/build.txt" 2>&1
          go vet ./... > "$evidence/vet.txt" 2>&1
          unformatted="$(gofmt -l ./cmd ./internal ./migrations)"
          if [ -n "$unformatted" ]; then
            printf 'Go files requiring gofmt:\n%s\n' "$unformatted"
            gofmt -d ./cmd ./internal ./migrations
            exit 1
          fi

      - name: Preserve exact-source evidence including failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: backend-${{ matrix.go-version }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/ci/backend-${{ matrix.go-version }}/
          if-no-files-found: error
          retention-days: 30
