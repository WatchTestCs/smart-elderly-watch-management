name: Security

on:
  push:
    branches: [preview, main]
  pull_request:
    branches: [preview, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL / ${{ matrix.language }}
    # Ordinary pull_request runs keep fork tokens read-only and expose no secrets.
    # GitHub permits CodeQL uploads for this event; do not use pull_request_target.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact analysis source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual_source_sha=$(git rev-parse HEAD)
          test "$actual_source_sha" = "$EXPECTED_SOURCE_SHA"
          printf '%s\n' "$actual_source_sha" > "$RUNNER_TEMP/codeql-source.txt"

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: 智慧养老手表管理系统/backend/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build Go for analysis
        if: matrix.language == 'go'
        working-directory: 智慧养老手表管理系统/backend
        run: go build ./...

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
          output: ${{ runner.temp }}/codeql-sarif

      - name: Preserve exact-source CodeQL findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codeql-${{ matrix.language }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/codeql-sarif
            ${{ runner.temp }}/codeql-source.txt
          if-no-files-found: warn
          retention-days: 7

