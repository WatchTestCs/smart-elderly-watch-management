name: Security

on:
  push:
    branches: [preview, 'codex/**']
  pull_request:
    branches: [preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL / ${{ matrix.language }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.2'
          cache-dependency-path: 智慧养老手表管理系统/backend/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build Go for analysis
        if: matrix.language == 'go'
        working-directory: 智慧养老手表管理系统/backend
        run: go build ./...

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"

  # Temporary CodeQL alert metadata probe, scoped to PR #39.
  # Prints only rule, severity and file location, not source or credentials.
  codeql-diagnostic:
    name: CodeQL diagnostic / PR alert metadata
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 39 }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      checks: read
      security-events: read
    steps:
      - name: Inspect PR 39 high-severity annotations
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo '== PR CodeQL check annotations =='
          gh api "repos/$REPOSITORY/check-runs/122675124065/annotations?per_page=100" \
            --jq '.[] | {path, start_line, end_line, annotation_level, title, message:(.message | .[0:500])}' || true
          echo '== Open CodeQL alerts metadata =='
          gh api "repos/$REPOSITORY/code-scanning/alerts?state=open&per_page=100" \
            --jq '[.[] | {number, rule:(.rule.id), severity:(.rule.security_severity), path:(.most_recent_instance.location.path), line:(.most_recent_instance.location.start_line), url:html_url}]' || true

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: development, runtime
