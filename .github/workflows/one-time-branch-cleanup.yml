name: One-time branch cleanup
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/one-time-branch-cleanup.yml'
permissions:
  contents: write
jobs:
  delete-obsolete-branches:
    if: github.repository == 'WatchTestCs/smart-elderly-watch-management'
    runs-on: ubuntu-latest
    steps:
      - name: Delete 13 approved branches, preserve main and preview
        uses: actions/github-script@v7
        with:
          script: |
            const names = ["automation/free-pr-review","cleanup/2.0.2-proven-dead-files","cleanup/2.0.5-deadcode-audit","feature/2.0.5-care-operations","preview-publish-20261015","refactor/2.0.2-device-method-modules","refactor/2.0.2-final-go-modules","refactor/2.0.2-split-handlers","refactor/2.0.2-split-remaining-go","refactor/2.0.2-split-vue-logic","refactor/2.0.2-split-vue-styles","release/2.0.3-source","release/2.0.5-source"];
            const protectedNames = new Set(['main', 'preview']);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const failures = [];
            for (const name of names) {
              if (protectedNames.has(name)) {
                throw Error('Refusing to delete protected branch: ' + name);
              }
              try {
                await github.rest.git.deleteRef({owner, repo, ref: 'heads/' + name});
                core.info('Deleted branch: ' + name);
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  core.warning('Branch missing or no longer deletable: ' + name + ' (' + error.message + ')');
                } else {
                  failures.push(name + ': ' + error.message);
                  core.error('Failed to delete ' + name + ': ' + error.message);
                }
              }
            }
            if (failures.length) {
              core.setFailed('Branch cleanup failures: ' + failures.join('; '));
            }
