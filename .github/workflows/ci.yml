name: Preview CI

on:
  pull_request:
    branches: [preview, main]
  push:
    branches: [preview, main]
  workflow_dispatch:
    inputs:
      require_native:
        description: Require a real SDK build for a formal release candidate; missing SDK configuration must fail
        type: boolean
        default: false
      build_desktop:
        description: Build and exercise the actual Windows Setup and Portable distributions
        type: boolean
        default: false
      sdk_url:
        description: Optional HTTPS URL of Windows Command Line Tools 26.0.0.865 for native watch compilation
        type: string
        default: ''
      sdk_sha256:
        description: Required expected SDK SHA-256 when sdk_url is supplied
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: preview-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test fail-closed change classification
        run: python3 -m unittest discover -s scripts/reliability -p test_pr_change_scope.py
      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/reliability/pr_change_scope.py >> "$GITHUB_OUTPUT"

  docs-check:
    name: Documentation / verify
    needs: change-scope
    if: ${{ github.event_name == 'pull_request' && needs.change-scope.outputs.docs_only == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify changed Markdown links
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/reliability/check_pr_docs.py
      - name: Parse GitHub Issue templates
        run: |
          ruby -ryaml -e 'Dir[".github/ISSUE_TEMPLATE/*.{yml,yaml}"].each { |file| parsed = YAML.safe_load_file(file); abort "invalid Issue template: #{file}" unless parsed.is_a?(Hash); next if File.basename(file) == "config.yml"; abort "invalid Issue form: #{file}" unless parsed["name"] && parsed["body"].is_a?(Array) }'

  fast-gate:
    needs: change-scope
    if: needs.change-scope.outputs.docs_only != 'true'
    name: Fast source validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check source architecture and generated OpenAPI
        run: |
          python3 scripts/check-api-boundary.py
          python3 scripts/check-go-module-boundaries.py
          python3 scripts/generate-openapi.py --check
  frontend:
    needs: [change-scope, fast-gate]
    if: needs.change-scope.outputs.docs_only != 'true'
    name: Frontend
    uses: ./.github/workflows/reusable-frontend.yml

  ui-quality:
    needs: [change-scope, fast-gate]
    if: needs.change-scope.outputs.docs_only != 'true'
    name: UI Quality
    uses: ./.github/workflows/ui-quality.yml

  watch:
    needs: change-scope
    if: needs.change-scope.outputs.docs_only != 'true'
    name: Watch protocol
    uses: ./.github/workflows/reusable-watch.yml
    with:
      sdk_url: ${{ inputs.sdk_url || '' }}
      sdk_sha256: ${{ inputs.sdk_sha256 || vars.HARMONY_SDK_DOWNLOAD_SHA256 || vars.HARMONY_SDK_SHA256 || '' }}
      require_native: ${{ inputs.require_native || github.event_name == 'push' }}
    secrets:
      sdk_download_url: ${{ secrets.HARMONY_SDK_DOWNLOAD_URL }}

  simulator-scope:
    needs: change-scope
    if: needs.change-scope.outputs.docs_only != 'true'
    name: Scope simulator matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-matrix: ${{ steps.scope.outputs.run || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify pull request changes
        if: github.event_name == 'pull_request'
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: pwsh
        run: |
          python3 -m unittest discover -s scripts/reliability -p test_watch_simulator_scope.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python3 scripts/reliability/watch_simulator_scope.py

  simulator-tests:
    name: Watch simulator tests
    needs: simulator-scope
    if: needs.simulator-scope.outputs.run-matrix == 'true'
    uses: ./.github/workflows/watch-simulator.yml

  simulator:
    name: Watch simulator
    if: ${{ always() && needs.change-scope.outputs.docs_only != 'true' }}
    needs: [change-scope, simulator-scope, simulator-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check simulator matrix result
        shell: pwsh
        env:
          SCOPE_RESULT: ${{ needs['simulator-scope'].result }}
          RUN_MATRIX: ${{ needs['simulator-scope'].outputs.run-matrix }}
          SIMULATOR_RESULT: ${{ needs['simulator-tests'].result }}
        run: |
          if ($env:SCOPE_RESULT -ne 'success') {
            throw 'Simulator change classification failed.'
          }
          switch ($env:RUN_MATRIX) {
            'true' { $expected = 'success' }
            'false' { $expected = 'skipped' }
            default { throw "Invalid simulator scope: $env:RUN_MATRIX" }
          }
          if ($env:SIMULATOR_RESULT -ne $expected) {
            throw "Expected $expected from simulator matrix, got $env:SIMULATOR_RESULT."
          }

  dependency-review:
    name: Dependency review
    needs: change-scope
    if: ${{ github.event_name == 'pull_request' && needs.change-scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          fail-on-scopes: development, runtime

  backend:
    needs: [change-scope, fast-gate]
    if: needs.change-scope.outputs.docs_only != 'true'
    name: Backend
    uses: ./.github/workflows/reusable-backend.yml

  windows:
    needs: [change-scope, fast-gate]
    if: needs.change-scope.outputs.docs_only != 'true'
    name: Windows sidecar contract
    uses: ./.github/workflows/reusable-windows-package.yml
    with:
      build_desktop: ${{ inputs.build_desktop || github.event_name == 'push' }}

  deployment:
    needs: change-scope
    if: needs.change-scope.outputs.docs_only != 'true'
    name: Deployment and alerts
    uses: ./.github/workflows/deploy-contract.yml

  security-scan:
    needs: change-scope
    if: needs.change-scope.outputs.docs_only != 'true'
    name: Current-source vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: backend/go.sum
      - name: Scan reachable Go vulnerabilities
        shell: bash
        working-directory: backend
        run: |
          mkdir -p ../evidence/ci/security
          git rev-parse HEAD > ../evidence/ci/security/source-sha.txt
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck -json ./... > ../evidence/ci/security/govulncheck.jsonl 2>&1
          # JSON output exits zero even when vulnerable symbols are reachable.
          govulncheck -mode=convert < ../evidence/ci/security/govulncheck.jsonl | tee ../evidence/ci/security/govulncheck.txt
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: security-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/ci/security/
          if-no-files-found: error

  required:
    name: Core CI / required
    if: ${{ always() }}
    needs: [change-scope, docs-check, fast-gate, frontend, ui-quality, watch, simulator, backend, windows, deployment, security-scan, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify release gate fail-closed regressions
        if: needs.change-scope.outputs.docs_only != 'true'
        run: python3 -m unittest discover -s scripts/reliability -p 'test_*.py' -v
      - name: Require all risk-appropriate checks
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          DOCS_ONLY: ${{ needs.change-scope.outputs.docs_only }}
          DOCS_RESULT: ${{ needs.docs-check.result }}
          FAST_RESULT: ${{ needs.fast-gate.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          UI_RESULT: ${{ needs.ui-quality.result }}
          WATCH_RESULT: ${{ needs.watch.result }}
          SIMULATOR_RESULT: ${{ needs.simulator.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment.result }}
          SECURITY_RESULT: ${{ needs.security-scan.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = success
          if [ "$DOCS_ONLY" = true ]; then
            test "$DOCS_RESULT" = success
            for result in "$FAST_RESULT" "$FRONTEND_RESULT" "$UI_RESULT" "$WATCH_RESULT" "$SIMULATOR_RESULT" "$BACKEND_RESULT" "$WINDOWS_RESULT" "$DEPLOYMENT_RESULT" "$SECURITY_RESULT" "$DEPENDENCY_RESULT"; do
              test "$result" = skipped
            done
          elif [ "$DOCS_ONLY" = false ]; then
            test "$DOCS_RESULT" = skipped
            for result in "$FAST_RESULT" "$FRONTEND_RESULT" "$UI_RESULT" "$WATCH_RESULT" "$SIMULATOR_RESULT" "$BACKEND_RESULT" "$WINDOWS_RESULT" "$DEPLOYMENT_RESULT" "$SECURITY_RESULT"; do
              test "$result" = success
            done
            test "$DEPENDENCY_RESULT" = success || test "$DEPENDENCY_RESULT" = skipped
          else
            echo "Invalid or missing change classification" >&2
            exit 1
          fi
