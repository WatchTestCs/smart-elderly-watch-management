name: Preview CI

on:
  pull_request:
    branches: [preview, main]
  push:
    branches: [preview, main]
  workflow_dispatch:
    inputs:
      require_native:
        description: Require a real SDK build for a formal release candidate; missing SDK configuration must fail
        type: boolean
        default: false
      build_desktop:
        description: Build and exercise the actual Windows Setup and Portable distributions
        type: boolean
        default: false
      sdk_url:
        description: Optional HTTPS URL of Windows Command Line Tools 6.1.1.280 for native watch compilation
        type: string
        default: ''
      sdk_sha256:
        description: Required expected SDK SHA-256 when sdk_url is supplied
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: preview-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: PR change scope
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      frontend: ${{ steps.scope.outputs.frontend }}
      ui: ${{ steps.scope.outputs.ui }}
      backend: ${{ steps.scope.outputs.backend }}
      watch: ${{ steps.scope.outputs.watch }}
      simulator: ${{ steps.scope.outputs.simulator }}
      windows: ${{ steps.scope.outputs.windows }}
      deployment: ${{ steps.scope.outputs.deployment }}
      security: ${{ steps.scope.outputs.security }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Determine affected modules
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci/change-scope.py

  frontend:
    if: needs.classify.outputs.frontend == 'true'
    needs: classify
    name: Frontend
    uses: ./.github/workflows/reusable-frontend.yml

  ui-quality:
    if: needs.classify.outputs.ui == 'true'
    needs: classify
    name: UI Quality
    uses: ./.github/workflows/ui-quality.yml

  watch:
    if: needs.classify.outputs.watch == 'true'
    needs: classify
    name: Watch protocol
    uses: ./.github/workflows/reusable-watch.yml
    with:
      sdk_url: ${{ inputs.sdk_url || vars.HARMONY_SDK_URL || '' }}
      sdk_sha256: ${{ inputs.sdk_sha256 || vars.HARMONY_SDK_SHA256 || '' }}
      require_native: ${{ inputs.require_native || github.event_name == 'push' }}

  simulator-tests:
    if: needs.classify.outputs.simulator == 'true'
    needs: classify
    name: Watch simulator tests
    uses: ./.github/workflows/watch-simulator.yml

  simulator:
    name: Watch simulator
    if: ${{ always() && needs.classify.outputs.simulator == 'true' }}
    needs: [classify, simulator-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both simulator platforms
        env:
          SIMULATOR_RESULT: ${{ needs['simulator-tests'].result }}
        run: test "$SIMULATOR_RESULT" = success

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' && needs.classify.outputs.security == 'true' }}
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          fail-on-scopes: development, runtime

  backend:
    if: needs.classify.outputs.backend == 'true'
    needs: classify
    name: Backend
    uses: ./.github/workflows/reusable-backend.yml

  windows:
    if: needs.classify.outputs.windows == 'true'
    needs: classify
    name: Windows sidecar contract
    uses: ./.github/workflows/reusable-windows-package.yml
    with:
      build_desktop: ${{ inputs.build_desktop || github.event_name == 'push' }}

  deployment:
    if: needs.classify.outputs.deployment == 'true'
    needs: classify
    name: Deployment and alerts
    uses: ./.github/workflows/deploy-contract.yml

  security-scan:
    if: needs.classify.outputs.security == 'true'
    needs: classify
    name: Current-source vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: 智慧养老手表管理系统/backend/go.sum
      - name: Scan reachable Go vulnerabilities
        shell: bash
        working-directory: 智慧养老手表管理系统/backend
        run: |
          mkdir -p ../../evidence/ci/security
          git rev-parse HEAD > ../../evidence/ci/security/source-sha.txt
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck -json ./... > ../../evidence/ci/security/govulncheck.jsonl 2>&1
          # JSON output exits zero even when vulnerable symbols are reachable.
          govulncheck -mode=convert < ../../evidence/ci/security/govulncheck.jsonl | tee ../../evidence/ci/security/govulncheck.txt
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: security-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/ci/security/
          if-no-files-found: error

  required:
    name: Core CI / required
    if: ${{ always() && needs.classify.result == 'success' }}
    needs: [classify, frontend, ui-quality, watch, simulator, backend, windows, deployment, security-scan, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate PR diff whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"
      - name: Verify release gate fail-closed regressions
        if: needs.classify.outputs.full == 'true'
        run: python3 -m unittest discover -s scripts/reliability -p 'test_*.py' -v
      - name: Require all core checks
        shell: bash
        env:
          FRONTEND: ${{ needs.frontend.result }}
          UI: ${{ needs['ui-quality'].result }}
          WATCH: ${{ needs.watch.result }}
          SIMULATOR: ${{ needs.simulator.result }}
          BACKEND: ${{ needs.backend.result }}
          WINDOWS: ${{ needs.windows.result }}
          DEPLOYMENT: ${{ needs.deployment.result }}
          SECURITY: ${{ needs['security-scan'].result }}
          DEPENDENCY: ${{ needs['dependency-review'].result }}
          WANT_FRONTEND: ${{ needs.classify.outputs.frontend }}
          WANT_UI: ${{ needs.classify.outputs.ui }}
          WANT_WATCH: ${{ needs.classify.outputs.watch }}
          WANT_SIMULATOR: ${{ needs.classify.outputs.simulator }}
          WANT_BACKEND: ${{ needs.classify.outputs.backend }}
          WANT_WINDOWS: ${{ needs.classify.outputs.windows }}
          WANT_DEPLOYMENT: ${{ needs.classify.outputs.deployment }}
          WANT_SECURITY: ${{ needs.classify.outputs.security }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          check() {
            local result="$1" selected="$2"
            if [ "$selected" = true ]; then
              test "$result" = success
            else
              test "$result" = skipped
            fi
          }
          check "$FRONTEND" "$WANT_FRONTEND"
          check "$UI" "$WANT_UI"
          check "$WATCH" "$WANT_WATCH"
          check "$SIMULATOR" "$WANT_SIMULATOR"
          check "$BACKEND" "$WANT_BACKEND"
          check "$WINDOWS" "$WANT_WINDOWS"
          check "$DEPLOYMENT" "$WANT_DEPLOYMENT"
          check "$SECURITY" "$WANT_SECURITY"
          if [ "$IS_PR" = true ] && [ "$WANT_SECURITY" = true ]; then
            test "$DEPENDENCY" = success
          else
            test "$DEPENDENCY" = skipped
          fi
