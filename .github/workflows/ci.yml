name: Preview CI

on:
  pull_request:
    branches: [preview]
  push:
    branches: [preview, 'codex/**']
  workflow_dispatch:
    inputs:
      require_native:
        description: Native SDK compilation is always required; retained for dispatch compatibility
        type: boolean
        default: true
      build_desktop:
        description: Build and exercise the actual Windows Setup and Portable distributions
        type: boolean
        default: false
      sdk_url:
        description: Optional HTTPS URL of Windows Command Line Tools 6.1.1.280 for native watch compilation
        type: string
        default: ''
      sdk_sha256:
        description: Required expected SDK SHA-256 when sdk_url is supplied
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: preview-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    uses: ./.github/workflows/reusable-frontend.yml

  ui-quality:
    name: UI Quality
    uses: ./.github/workflows/ui-quality.yml

  watch:
    name: Watch protocol
    uses: ./.github/workflows/reusable-watch.yml
    with:
      sdk_url: ${{ inputs.sdk_url || vars.HARMONY_SDK_URL || '' }}
      sdk_sha256: ${{ inputs.sdk_sha256 || vars.HARMONY_SDK_SHA256 || '' }}

  backend:
    name: Backend
    uses: ./.github/workflows/reusable-backend.yml

  simulator:
    name: Watch simulator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Verify simulator state machine, SOS retry and device signing
        run: node --test watch-sim/watch-sim.test.cjs
        working-directory: 智慧养老手表管理系统

  windows:
    name: Windows sidecar contract
    uses: ./.github/workflows/reusable-windows-package.yml
    with:
      build_desktop: ${{ inputs.build_desktop || false }}

  deployment:
    name: Deployment and alerts
    uses: ./.github/workflows/deploy-contract.yml

  security-scan:
    name: Current-source vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.2'
          cache-dependency-path: 智慧养老手表管理系统/backend/go.sum
      - name: Scan reachable Go vulnerabilities
        working-directory: 智慧养老手表管理系统/backend
        run: |
          mkdir -p ../../evidence/ci/security
          git rev-parse HEAD > ../../evidence/ci/security/source-sha.txt
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck -json ./... > ../../evidence/ci/security/govulncheck.jsonl 2>&1
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: security-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/ci/security/
          if-no-files-found: error

  required:
    name: Core CI / required
    if: ${{ always() }}
    needs: [frontend, ui-quality, watch, simulator, backend, windows, deployment, security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify release gate fail-closed regressions
        run: python3 -m unittest discover -s scripts/reliability -p 'test_*.py' -v
      - name: Require all core checks
        shell: bash
        run: |
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.ui-quality.result }}" = "success"
          test "${{ needs.watch.result }}" = "success"
          test "${{ needs.simulator.result }}" = "success"
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.windows.result }}" = "success"
          test "${{ needs.deployment.result }}" = "success"
          test "${{ needs.security-scan.result }}" = "success"
