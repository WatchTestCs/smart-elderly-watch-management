name: Preview CI

on:
  pull_request:
    branches: [preview, main]
  push:
    branches: [preview, main]
  workflow_dispatch:
    inputs:
      require_native:
        description: Require a real SDK build for a formal release candidate; missing SDK configuration must fail
        type: boolean
        default: false
      build_desktop:
        description: Build and exercise the actual Windows Setup and Portable distributions
        type: boolean
        default: false
      sdk_url:
        description: Optional HTTPS URL of Windows Command Line Tools 6.1.1.280 for native watch compilation
        type: string
        default: ''
      sdk_sha256:
        description: Required expected SDK SHA-256 when sdk_url is supplied
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: preview-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: PR change scope
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Identify Markdown-only pull requests
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          python3 - <<'PY'
          import os
          from pathlib import Path

          paths = [p.decode() for p in Path(os.environ["RUNNER_TEMP"], "changed-files").read_bytes().split(b"\0") if p]
          markdown_only = bool(paths) and all(p.endswith((".md", ".mdx")) for p in paths)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"full={str(not markdown_only).lower()}\n")
          print(f"{len(paths)} changed files; {'full CI' if not markdown_only else 'Markdown-only fast path'}")
          PY

  frontend:
    if: needs.classify.outputs.full == 'true'
    needs: classify
    name: Frontend
    uses: ./.github/workflows/reusable-frontend.yml

  ui-quality:
    if: needs.classify.outputs.full == 'true'
    needs: classify
    name: UI Quality
    uses: ./.github/workflows/ui-quality.yml

  watch:
    if: needs.classify.outputs.full == 'true'
    needs: classify
    name: Watch protocol
    uses: ./.github/workflows/reusable-watch.yml
    with:
      sdk_url: ${{ inputs.sdk_url || vars.HARMONY_SDK_URL || '' }}
      sdk_sha256: ${{ inputs.sdk_sha256 || vars.HARMONY_SDK_SHA256 || '' }}
      require_native: ${{ inputs.require_native || github.event_name == 'push' }}

  simulator-tests:
    if: needs.classify.outputs.full == 'true'
    needs: classify
    name: Watch simulator tests
    uses: ./.github/workflows/watch-simulator.yml

  simulator:
    name: Watch simulator
    if: ${{ always() && needs.classify.outputs.full == 'true' }}
    needs: [classify, simulator-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both simulator platforms
        env:
          SIMULATOR_RESULT: ${{ needs['simulator-tests'].result }}
        run: test "$SIMULATOR_RESULT" = success

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' && needs.classify.outputs.full == 'true' }}
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          fail-on-scopes: development, runtime

  backend:
    if: needs.classify.outputs.full == 'true'
    needs: classify
    name: Backend
    uses: ./.github/workflows/reusable-backend.yml

  windows:
    if: needs.classify.outputs.full == 'true'
    needs: classify
    name: Windows sidecar contract
    uses: ./.github/workflows/reusable-windows-package.yml
    with:
      build_desktop: ${{ inputs.build_desktop || github.event_name == 'push' }}

  deployment:
    if: needs.classify.outputs.full == 'true'
    needs: classify
    name: Deployment and alerts
    uses: ./.github/workflows/deploy-contract.yml

  security-scan:
    if: needs.classify.outputs.full == 'true'
    needs: classify
    name: Current-source vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: 智慧养老手表管理系统/backend/go.sum
      - name: Scan reachable Go vulnerabilities
        shell: bash
        working-directory: 智慧养老手表管理系统/backend
        run: |
          mkdir -p ../../evidence/ci/security
          git rev-parse HEAD > ../../evidence/ci/security/source-sha.txt
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck -json ./... > ../../evidence/ci/security/govulncheck.jsonl 2>&1
          # JSON output exits zero even when vulnerable symbols are reachable.
          govulncheck -mode=convert < ../../evidence/ci/security/govulncheck.jsonl | tee ../../evidence/ci/security/govulncheck.txt
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: security-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/ci/security/
          if-no-files-found: error

  required:
    name: Core CI / required
    if: ${{ always() && needs.classify.result == 'success' }}
    needs: [classify, frontend, ui-quality, watch, simulator, backend, windows, deployment, security-scan, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate Markdown-only changes
        if: needs.classify.outputs.full == 'false'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"
      - name: Verify release gate fail-closed regressions
        if: needs.classify.outputs.full == 'true'
        run: python3 -m unittest discover -s scripts/reliability -p 'test_*.py' -v
      - name: Require all core checks
        if: needs.classify.outputs.full == 'true'
        shell: bash
        run: |
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.ui-quality.result }}" = "success"
          test "${{ needs.watch.result }}" = "success"
          test "${{ needs.simulator.result }}" = "success"
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.windows.result }}" = "success"
          test "${{ needs.deployment.result }}" = "success"
          test "${{ needs.security-scan.result }}" = "success"
          test "${{ needs['dependency-review'].result }}" = "success" || test "${{ needs['dependency-review'].result }}" = "skipped"
