name: PR108 format changed Go files

on:
  push:
    branches: [refactor/preview-ts-scopes-20261107]
    paths: [.github/workflows/pr108-gofmt-once.yml]

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Format changed Go source
        working-directory: 智慧养老手表管理系统/backend
        run: |
          gofmt -w internal/authrepo/login.go \
            internal/handlers/handler_device_admin.go \
            internal/handlers/handler_device_protocol.go \
            internal/handlers/handler_device_repository.go \
            internal/handlers/handler_device_sos.go
          git add internal/authrepo/login.go \
            internal/handlers/handler_device_admin.go \
            internal/handlers/handler_device_protocol.go \
            internal/handlers/handler_device_repository.go \
            internal/handlers/handler_device_sos.go
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(go): format merged device and auth source"
            git push origin HEAD:refs/heads/refactor/preview-ts-scopes-20261107
          fi
