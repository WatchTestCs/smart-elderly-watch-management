name: One-time Go formatting for PR 108
on:
  push:
    branches: [refactor/preview-ts-scopes-20261107]
    paths: [.github/workflows/format-pr108-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/preview-ts-scopes-20261107
      - name: Apply gofmt
        working-directory: '智慧养老手表管理系统/backend'
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal ./migrations
          git add cmd internal migrations
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -m 'style(go): format extracted device binding'
          git push origin HEAD:refs/heads/refactor/preview-ts-scopes-20261107
