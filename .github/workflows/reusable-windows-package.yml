name: Reusable Tauri contract
on:
  workflow_call:
    inputs:
      build_desktop:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: 智慧养老手表管理系统/backend/go.sum
      - name: Validate all product versions
        shell: pwsh
        run: ./智慧养老手表管理系统/desktop/validate-version.ps1
      - name: Parse active PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem '智慧养老手表管理系统/desktop' -Filter '*.ps1' | ForEach-Object {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count){throw ($errors|Out-String)}
          }
      - name: Build native Windows sidecar and record source/hash
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence/ci/windows | Out-Null
          git rev-parse HEAD | Set-Content evidence/ci/windows/source-sha.txt
          Push-Location '智慧养老手表管理系统/backend'
          $env:CGO_ENABLED = '0'
          go test -run '^$' -bench '^BenchmarkSafe$' -benchtime=100ms -cpuprofile '../../evidence/ci/windows/default.pgo' ./internal/jsonscan
          if ($LASTEXITCODE) { throw 'PGO profile generation failed' }
          go build -trimpath -pgo='../../evidence/ci/windows/default.pgo' -ldflags='-s -w' -o '../../evidence/ci/windows/suining-server.exe' ./cmd/server
          if ($LASTEXITCODE) { throw 'Windows sidecar build failed' }
          Pop-Location
          Get-FileHash evidence/ci/windows/suining-server.exe -Algorithm SHA256 | ConvertTo-Json | Set-Content evidence/ci/windows/sha256.json
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: windows-sidecar-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/ci/windows/
          if-no-files-found: error

  desktop:
    name: Tauri build and installation
    if: ${{ inputs.build_desktop }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache-dependency-path: 智慧养老手表管理系统/backend/go.sum
      - name: Build and exercise the actual desktop distributions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force evidence/ci/windows-desktop | Out-Null
          git rev-parse HEAD | Set-Content evidence/ci/windows-desktop/source-sha.txt
          rustup toolchain install stable --profile minimal --no-self-update
          if ($LASTEXITCODE) { throw 'Rust toolchain setup failed' }
          rustc --version | Set-Content evidence/ci/windows-desktop/rust-version.txt
          ./智慧养老手表管理系统/desktop/build.ps1 *>&1 | Tee-Object evidence/ci/windows-desktop/build.log
          python ./智慧养老手表管理系统/desktop/build-fontless.py *>&1 | Tee-Object evidence/ci/windows-desktop/fontless.log
          ./智慧养老手表管理系统/desktop/package-release.ps1 *>&1 | Tee-Object evidence/ci/windows-desktop/package.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: suining-setup-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            智慧养老手表管理系统/outputs/*/release/Suining-Setup-*.exe
            智慧养老手表管理系统/outputs/*/release/SHA256SUMS.txt
            智慧养老手表管理系统/outputs/*/release/release-manifest.json
            evidence/ci/windows-desktop/source-sha.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: suining-portable-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            智慧养老手表管理系统/outputs/*/release/Suining-Portable-*.zip
            智慧养老手表管理系统/outputs/*/release/SHA256SUMS.txt
            智慧养老手表管理系统/outputs/*/release/release-manifest.json
            evidence/ci/windows-desktop/source-sha.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: suining-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            智慧养老手表管理系统/outputs/*/release/Suining-Source-*.zip
            智慧养老手表管理系统/outputs/*/release/SHA256SUMS.txt
            智慧养老手表管理系统/outputs/*/release/release-manifest.json
            evidence/ci/windows-desktop/source-sha.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: suining-native-nofonts-win-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            智慧养老手表管理系统/outputs/*/release/Suining-Native-NoFonts-*-win-x64.exe
            智慧养老手表管理系统/outputs/*/release/SHA256SUMS.txt
            智慧养老手表管理系统/outputs/*/release/release-manifest.json
            evidence/ci/windows-desktop/source-sha.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: suining-native-nofonts-linux-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            智慧养老手表管理系统/outputs/*/release/Suining-Native-NoFonts-*-linux-x64.tar.gz
            智慧养老手表管理系统/outputs/*/release/SHA256SUMS.txt
            智慧养老手表管理系统/outputs/*/release/release-manifest.json
            evidence/ci/windows-desktop/source-sha.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: suining-native-nofonts-linux-arm64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            智慧养老手表管理系统/outputs/*/release/Suining-Native-NoFonts-*-linux-arm64.tar.gz
            智慧养老手表管理系统/outputs/*/release/SHA256SUMS.txt
            智慧养老手表管理系统/outputs/*/release/release-manifest.json
            evidence/ci/windows-desktop/source-sha.txt
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: windows-desktop-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/ci/windows-desktop/
            智慧养老手表管理系统/outputs/*/release/*
          if-no-files-found: error
