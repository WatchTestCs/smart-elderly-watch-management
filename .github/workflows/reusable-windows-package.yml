name: Reusable Tauri contract
on:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate all product versions
        shell: pwsh
        run: ./智慧养老手表管理系统/desktop/validate-version.ps1
      - name: Parse active PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem '智慧养老手表管理系统/desktop' -Filter '*.ps1' | ForEach-Object {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count){throw ($errors|Out-String)}
          }
