name: Publish 2.0.5 cleanup source revision
on:
  push:
    branches: [preview]
    paths:
      - 'docs/releases/2.0.5-cleanup.1.md'
permissions:
  contents: write
jobs:
  source:
    if: github.repository == 'WatchTestCs/smart-elderly-watch-management'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify and archive revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < '智慧养老手表管理系统/backend/VERSION')" = '2.0.5'
          test ! -e '.github/workflows/deadcode-audit-temp.yml'
          grep -q '//go:embed all:web' '智慧养老手表管理系统/backend/internal/handlers/web.go'
          test -f '智慧养老手表管理系统/backend/internal/handlers/web/.gitkeep'
          git archive --format=zip --prefix=suining-2.0.5-cleanup.1-source/ --output=Suining-2.0.5-cleanup.1-source.zip HEAD
          sha256sum Suining-2.0.5-cleanup.1-source.zip > SHA256SUMS.txt
          unzip -tqq Suining-2.0.5-cleanup.1-source.zip
          unzip -Z1 Suining-2.0.5-cleanup.1-source.zip > archive-files.txt
          grep -Fxq 'suining-2.0.5-cleanup.1-source/docs/releases/2.0.5-cleanup.1.md' archive-files.txt
      - name: Publish immutable revision tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.0.5-cleanup.1 >/dev/null 2>&1; then
            echo 'revision already published, refusing overwrite' >&2
            exit 1
          fi
          gh release create v2.0.5-cleanup.1 Suining-2.0.5-cleanup.1-source.zip SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title '岁宁 2.0.5 · 死代码清理修订 1（源码）' \
            --notes-file docs/releases/2.0.5-cleanup.1.md \
            --prerelease
