name: Temporary Go 2.0.5 formatter
on:
  push:
    branches: [feature/2.0.5-care-operations]
    paths:
      - '.github/workflows/format-205.yml'
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'WatchTestCs/smart-elderly-watch-management' && github.ref == 'refs/heads/feature/2.0.5-care-operations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Format Go files
        run: |
          gofmt -w '智慧养老手表管理系统/backend/internal/handlers/'*.go '智慧养老手表管理系统/backend/internal/care/'*.go '智慧养老手表管理系统/backend/cmd/server/'*.go
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '智慧养老手表管理系统/backend/internal/handlers/' '智慧养老手表管理系统/backend/internal/care/' '智慧养老手表管理系统/backend/cmd/server/'
          if ! git diff --cached --quiet; then
            git commit -m "style(go): format 2.0.5 care and access audit sources"
            git push
          fi
