name: Additional preview UI checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm ci && npm run build
        working-directory: 智慧养老手表管理系统/frontend
      - run: npm ci && npx playwright install --with-deps chromium && npm test
        working-directory: 智慧养老手表管理系统/frontend/qa
      - run: node --test watch-sim/watch-sim.test.cjs
        working-directory: 智慧养老手表管理系统
