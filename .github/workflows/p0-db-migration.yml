name: P0 database upgrade verification

on:
  pull_request:
    branches: [preview, preview-publish-20261015, p0-device-secret-hash]
    paths:
      - ".github/workflows/p0-db-migration.yml"
      - "智慧养老手表管理系统/careold/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-db-migration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Flyway migrations / Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: 智慧养老手表管理系统/careold/pom.xml
      - name: Test migrations and hardware security contract
        run: |
          mvn --batch-mode -Dnet.bytebuddy.experimental=true -f "智慧养老手表管理系统/careold/pom.xml" clean verify
      - name: Preserve failing test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p0-db-migration-failure
          path: 智慧养老手表管理系统/careold/target/surefire-reports
          retention-days: 7
