name: Dual database migration verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: suining_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pci_root_only --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: careold
          POSTGRES_PASSWORD: careold
          POSTGRES_DB: careold_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U careold -d careold_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache-dependency-path: 智慧养老手表管理系统/backend/go.sum
      - run: |
          go run ./cmd/migrate
          go run ./cmd/migrate
          go run ./cmd/migrate --legacy-postgres
          go run ./cmd/migrate --legacy-postgres
          go test -race -count=1 -timeout 240s ./...
        working-directory: 智慧养老手表管理系统/backend
        env:
          MYSQL_DSN: root:ci_root_only@tcp(localhost:3306)/suining_test
          DATABASE_URL: postgres://careold:careold@localhost:5432/careold_test?sslmode=disable
          TEST_MYSQL_DSN: root:ci_root_only@tcp(localhost:3306)/suining_test
          TEST_DATABASE_URL: postgres://careold:careold@localhost:5432/careold_test?sslmode=disable
