name: Reusable watch protocol verification
on:
  workflow_call:
    inputs:
      sdk_url:
        type: string
        default: ''
      sdk_sha256:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  preflight:
    name: Native tool preflight only (no SDK)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify missing tools fail closed and caller environment is restored
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath Env:\JAVA_HOME -ErrorAction SilentlyContinue
          $env:NODE_PATH = 'watch-preflight-sentinel'
          $before = @{}
          foreach ($name in @('NODE_PATH', 'JAVA_HOME', 'DEVECO_SDK_HOME', 'PATH')) {
            $before[$name] = [Environment]::GetEnvironmentVariable($name, 'Process')
          }
          $evidence = Join-Path $PWD 'evidence/ci/watch-preflight'
          $reportPath = Join-Path $evidence 'native-build.json'
          $failed = $false
          try {
            & SuiningWatch/scripts/build.ps1 -DevEcoHome (Join-Path $env:RUNNER_TEMP 'missing-watch-sdk') -CommandLineHome '' -ReportPath $reportPath
          } catch { $failed = $true }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if (!$failed -or $report.status -ne 'blocked' -or $null -ne $report.artifact) {
            throw 'Missing tools must not report a successful native build or an old HAP'
          }
          foreach ($name in $before.Keys) {
            if ([Environment]::GetEnvironmentVariable($name, 'Process') -cne $before[$name]) {
              throw "Caller environment was not restored: $name"
            }
          }
          'Preflight contract passed; native compilation has not run.' | Set-Content (Join-Path $evidence 'result.txt')
      - name: Verify SDK version and archive rejection contracts
        shell: pwsh
        run: ./SuiningWatch/scripts/test-sdk.ps1
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: watch-preflight-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/ci/watch-preflight/
          if-no-files-found: error

  native:
    name: HarmonyOS SDK compile (no hardware)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record the reviewed SDK lock
        id: sdk
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./SuiningWatch/scripts/check-sdk.ps1
          $lock = Get-SuiningSdkLock
          "sha256=$($lock.archiveSha256)" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Path evidence/ci/watch-native -Force | Out-Null
          Copy-Item -LiteralPath SuiningWatch/scripts/sdk-lock.json -Destination evidence/ci/watch-native/sdk-lock.json
      - name: Cache the pinned archive (always verify before use)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/watch-commandline.zip
          key: watch-commandline-windows-${{ steps.sdk.outputs.sha256 }}
      - name: Acquire versioned SDK and compile unsigned wearable HAP
        shell: pwsh
        env:
          SDK_ARCHIVE_URL: ${{ inputs.sdk_url }}
          SDK_ARCHIVE_SHA256: ${{ inputs.sdk_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $PWD 'evidence/ci/watch-native'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          git rev-parse HEAD | Set-Content (Join-Path $evidence 'source-sha.txt')
          . ./SuiningWatch/scripts/check-sdk.ps1
          $lock = Get-SuiningSdkLock
          $url = $env:SDK_ARCHIVE_URL
          if (!$url) { $url = $lock.archiveUrl }
          $uri = [Uri]$url
          if ($uri.Scheme -ne 'https' -or $uri.UserInfo) { throw 'SDK must use an HTTPS URL without embedded credentials' }
          if ($env:SDK_ARCHIVE_SHA256 -and $env:SDK_ARCHIVE_SHA256 -ine $lock.archiveSha256) { throw 'SDK checksum override differs from the reviewed lock' }
          $uri.GetLeftPart([UriPartial]::Path) | Set-Content (Join-Path $evidence 'sdk-source.txt')
          $archive = Join-Path $env:RUNNER_TEMP 'watch-commandline.zip'
          if (!(Test-Path -LiteralPath $archive)) {
            curl.exe --fail --location --globoff --connect-timeout 20 --max-time 600 --retry 1 --output $archive --url $url
            if ($LASTEXITCODE -ne 0) { throw 'SDK download failed; native compilation has not run' }
          }
          Assert-SuiningSdkArchive -Archive $archive -ExpectedSha256 $env:SDK_ARCHIVE_SHA256
          Get-FileHash -LiteralPath $archive -Algorithm SHA256 | ConvertTo-Json | Set-Content (Join-Path $evidence 'sdk-sha256.json')
          $toolDirectory = Join-Path $env:RUNNER_TEMP 'watch-sdk'
          Expand-Archive -LiteralPath $archive -DestinationPath $toolDirectory
          $toolRoot = Join-Path $toolDirectory 'command-line-tools'
          & SuiningWatch/scripts/build.ps1 -CommandLineHome $toolRoot -ReportPath (Join-Path $evidence 'native-build.json')
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: watch-native-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/ci/watch-native/
            SuiningWatch/entry/build/default/outputs/default/*.hap
          if-no-files-found: error

  verify:
    name: Protocol and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SuiningWatch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: SuiningWatch/package-lock.json
      - name: Run portable protocol checks (not an ArkTS SDK build)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../evidence/ci/watch
          git rev-parse HEAD > ../evidence/ci/watch/source-sha.txt
          node --version > ../evidence/ci/watch/node-version.txt
          npm ci
          npm test 2>&1 | tee ../evidence/ci/watch/protocol-test.txt
          npm audit --audit-level=high --json > ../evidence/ci/watch/npm-audit.json
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: watch-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/ci/watch/
          if-no-files-found: error

  integration:
    name: Real backend and lost-ack recovery
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_watch_only
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: suining_watch_e2e
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pci_watch_only --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: SuiningWatch/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache-dependency-path: 智慧养老手表管理系统/backend/go.sum
      - name: Exercise production watch protocol against disposable Go/MySQL
        shell: bash
        env:
          MYSQL_DSN: root:ci_watch_only@tcp(127.0.0.1:3306)/suining_watch_e2e?parseTime=true
          ADDR: 127.0.0.1:18796
        run: |
          set -euo pipefail
          mkdir -p evidence/ci/watch-integration
          git rev-parse HEAD > evidence/ci/watch-integration/source-sha.txt
          npm ci --prefix SuiningWatch
          (cd 智慧养老手表管理系统/backend && go build -o "$RUNNER_TEMP/watch-e2e-server" ./cmd/server)
          export DATA_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          export DESKTOP_TOKEN="$(openssl rand -hex 32)"
          export IMAGE_DIR="$RUNNER_TEMP/watch-e2e-images"
          "$RUNNER_TEMP/watch-e2e-server" > evidence/ci/watch-integration/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 "http://$ADDR/api/v1/service/status" | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{try{process.exit(JSON.parse(s).databaseReady===true?0:1)}catch{process.exit(1)}})'; then
              break
            fi
            sleep 1
          done
          export WATCH_TEST_URL="http://$ADDR"
          export WATCH_TEST_SETUP_TOKEN="$DESKTOP_TOKEN"
          npm run test:e2e --prefix SuiningWatch 2>&1 | tee evidence/ci/watch-integration/result.txt
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: watch-integration-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/ci/watch-integration/
          if-no-files-found: error
