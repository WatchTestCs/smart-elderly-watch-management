name: Temporary gofmt for refactor
on:
  push:
    branches: [refactor/2.0.2-final-go-modules]
    paths: [.github/workflows/refactor-format.yml]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'WatchTestCs/smart-elderly-watch-management' && github.ref == 'refs/heads/refactor/2.0.2-final-go-modules'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: |
          gofmt -w '智慧养老手表管理系统/backend/internal/handlers/'*.go
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '智慧养老手表管理系统/backend/internal/handlers/'
          if ! git diff --cached --quiet; then
            git commit -m "style(go): format all extracted handler packages"
            git push
          fi
