name: Reusable frontend verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Build and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 智慧养老手表管理系统/oldIot
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: 智慧养老手表管理系统/oldIot/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Unit tests and incremental TypeScript checks
        run: |
          npm test
          npm run typecheck

      - name: Build production frontend
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
