name: One-time PR108 Go compile gate

on:
  push:
    branches: [refactor/preview-ts-scopes-20261107]
    paths:
      - .github/workflows/verify-pr108-once.yml
      - '智慧养老手表管理系统/backend/internal/inviterepo/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Exact-head Go compile and vet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/preview-ts-scopes-20261107
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: 智慧养老手表管理系统/backend/go.sum
      - name: Verify source, compile all packages, vet
        working-directory: 智慧养老手表管理系统/backend
        run: |
          set -euo pipefail
          git rev-parse HEAD
          unformatted="$(gofmt -l ./cmd ./internal ./migrations)"
          if [ -n "$unformatted" ]; then
            printf 'Go files requiring gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
          go test -run '^$' ./...
          go vet ./...
