# Add this override to platform.compose.yml for cross-host immutable image storage.
# Existing local images must be migrated and references verified before switching.
services:
  app:
    environment:
      BLOB_BACKEND: s3
      S3_ENDPOINT: ${S3_ENDPOINT:?Configure the private S3 HTTPS endpoint}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?Use a dedicated private bucket with public access blocked}
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
    secrets: [s3_access_key, s3_secret_key]
secrets:
  s3_access_key: {file: ./secrets/s3-access-key}
  s3_secret_key: {file: ./secrets/s3-secret-key}
