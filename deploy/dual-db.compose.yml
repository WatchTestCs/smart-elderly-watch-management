name: suining-dual-db
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: suining
      MYSQL_USER: suining
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: suining_analytics
      POSTGRES_USER: suining_analytics
      POSTGRES_PASSWORD: ${PG_ANALYTICS_PASSWORD:?Set PG_ANALYTICS_PASSWORD}
    ports:
      - "127.0.0.1:${PG_ANALYTICS_PORT:-15432}:5432"
    volumes:
      - analytics-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suining_analytics -d suining_analytics"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  mysql-data:
  analytics-data:
