server {
  listen 8080;
  server_name _;
  resolver 127.0.0.11 valid=5s;
  client_max_body_size 12m;
  location / {
    set $backend http://app:8080;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 40s;
  }
}
