map $uri $login_limit_key {
  default "";
  /restful/userLogin/login $binary_remote_addr;
  /restful/setup $binary_remote_addr;
  /restful/inviteCode/join $binary_remote_addr;
}
map $uri $hardware_limit_key {
  default "";
  ~^/restful/device/(heartbeat|report|healthBatch|commandPull|commandAck|fencePoint|sos)$ $binary_remote_addr;
}
# Shared zones bound edge memory and apply across all app replicas behind this
# ingress. Multiple ingress hosts require a shared external gateway/WAF quota.
limit_req_zone $login_limit_key zone=care_login:10m rate=3r/m;
limit_req_zone $hardware_limit_key zone=care_hardware:16m rate=60r/s;
server {
  listen 8080;
  server_name _;
  resolver 127.0.0.11 valid=5s;
  client_max_body_size 12m;
  location / {
    limit_req zone=care_login burst=30 nodelay;
    limit_req zone=care_hardware burst=1800 nodelay;
    limit_req_status 429;
    set $backend http://app:8080;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_read_timeout 40s;
  }
}
