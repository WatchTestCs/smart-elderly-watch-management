rule_files:
  - /etc/prometheus/alerts.yml
evaluation_interval: 15s
tests:
  - interval: 15s
    input_series:
      - series: 'up{job="suining",instance="app:8080"}'
        values: '1+0x25'
      - series: 'suining_care_notification_configured{job="suining",instance="app:8080"}'
        values: '1+0x25'
      - series: 'suining_care_receipt_configured{job="suining",instance="app:8080"}'
        values: '0+0x25'
    alert_rule_test:
      - eval_time: 3m
        alertname: SuiningCareReceiptVerificationDisabled
        exp_alerts:
          - exp_labels:
              job: suining
              instance: app:8080
              severity: critical
            exp_annotations:
              summary: "SOS gateway dispatch enabled but trusted delivery receipts cannot be validated"
              description: "The gateway may accept messages but the system cannot confirm delivery. Repair the receipt secret and use human fallback."
  - interval: 15s
    input_series:
      - series: 'up{job="suining",instance="app:8080"}'
        values: '1+0x25'
      - series: 'suining_care_notification_configured{job="suining",instance="app:8080"}'
        values: '0+0x25'
      - series: 'suining_care_receipt_configured{job="suining",instance="app:8080"}'
        values: '0+0x25'
    alert_rule_test:
      - eval_time: 3m
        alertname: SuiningCareReceiptVerificationDisabled
        exp_alerts: []
  - interval: 15s
    input_series:
      - series: 'up{job="suining",instance="app:8080"}'
        values: '1+0x35'
      - series: 'suining_database_ready{job="suining",instance="app:8080"}'
        values: '1+0x35'
      - series: 'suining_analytics_configured{job="suining",instance="app:8080"}'
        values: '1+0x35'
      - series: 'suining_analytics_ready{job="suining",instance="app:8080"}'
        values: '0+0x35'
    alert_rule_test:
      - eval_time: 6m
        alertname: SuiningOptionalAnalyticsUnavailable
        exp_alerts:
          - exp_labels:
              job: suining
              instance: app:8080
              severity: warning
            exp_annotations:
              summary: "Optional PostgreSQL analytics projection unavailable"
              description: "MySQL remains authoritative. Check the outbox and restore PG synchronization without blocking care operations."
      - eval_time: 6m
        alertname: SuiningBusinessDatabaseUnavailable
        exp_alerts: []
  - interval: 15s
    input_series:
      - series: 'up{job="suining",instance="app:8080"}'
        values: '1+0x25'
      - series: 'suining_care_worker_last_heartbeat_unixtime{job="suining",instance="app:8080"}'
        values: '10+0x25'
    alert_rule_test:
      - eval_time: 3m
        alertname: SuiningCareWorkerStale
        exp_alerts:
          - exp_labels:
              job: suining
              instance: app:8080
              severity: critical
            exp_annotations:
              summary: "SOS dispatcher heartbeat is stale"
              description: "This checks durable worker progress, not a guarantee of message delivery or responder arrival."
  - interval: 15s
    input_series:
      - series: 'up{job="suining",instance="app:8080"}'
        values: '1+0x25'
      - series: 'suining_database_ready{job="suining",instance="app:8080"}'
        values: '0+0x25'
    alert_rule_test:
      - eval_time: 2m
        alertname: SuiningBusinessDatabaseUnavailable
        exp_alerts:
          - exp_labels:
              job: suining
              instance: app:8080
              severity: critical
            exp_annotations:
              summary: "Suining MySQL business service unavailable"
              description: "The business API is not ready; activate the offline care response procedure."
  - interval: 15s
    input_series:
      - series: 'suining_care_outbox_oldest_age_seconds{job="suining",instance="app:8080"}'
        values: '180+0x25'
      - series: 'suining_care_queue_sample_valid{job="suining",instance="app:8080"}'
        values: '1+0x25'
    alert_rule_test:
      - eval_time: 2m
        alertname: SuiningCareQueueStalled
        exp_alerts:
          - exp_labels: {job: suining, instance: 'app:8080', severity: critical}
            exp_annotations:
              summary: "SOS notification jobs remain unfinished"
              description: "Inspect gateway failures and durable outbox. Delivery and human acknowledgement are independent states. Use the manual fallback."
  - interval: 15s
    input_series:
      - series: 'suining_care_outbox_oldest_age_seconds{job="suining",instance="app:8080"}'
        values: '180+0x25'
      - series: 'suining_care_queue_sample_valid{job="suining",instance="app:8080"}'
        values: '0+0x25'
    alert_rule_test:
      - eval_time: 2m
        alertname: SuiningCareQueueStalled
        exp_alerts: []
      - eval_time: 2m
        alertname: SuiningCareQueueObservationFailed
        exp_alerts:
          - exp_labels: {job: suining, instance: 'app:8080', severity: critical}
            exp_annotations:
              summary: "SOS queue progress cannot be observed"
              description: "An unavailable queue sample must never be interpreted as an empty healthy queue."
  - interval: 15s
    input_series:
      - series: 'suining_care_gateway_tls_configured{job="suining",instance="app:8080"}'
        values: '0+0x25'
    alert_rule_test:
      - eval_time: 2m
        alertname: SuiningCareGatewayTLSInvalid
        exp_alerts:
          - exp_labels: {job: suining, instance: 'app:8080', severity: critical}
            exp_annotations:
              summary: "SOS gateway TLS trust configuration is invalid"
              description: "Core MySQL ingestion remains available; dispatch is disabled and jobs remain durable. Repair certificate trust."
  - interval: 15s
    input_series:
      - series: 'suining_care_gateway_failures_total{job="suining",instance="app:8080",reason="http_5xx"}'
        values: '0+1x25'
    alert_rule_test:
      - eval_time: 3m
        alertname: SuiningCareGatewayRepeatedFailures
        exp_alerts:
          - exp_labels: {job: suining, instance: 'app:8080', reason: http_5xx, severity: critical}
            exp_annotations:
              summary: "SOS notification gateway repeatedly fails"
              description: "The reason label distinguishes DNS, timeout, network, HTTP and decryption failures. Check pending jobs and human fallback."
