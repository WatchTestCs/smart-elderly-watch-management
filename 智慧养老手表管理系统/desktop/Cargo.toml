[package]
name = "suining"
version = "2.0.4"
edition = "2021"
rust-version = "1.85"
description = "岁宁 · Tauri 照护桌面软件"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
panic = "abort"
