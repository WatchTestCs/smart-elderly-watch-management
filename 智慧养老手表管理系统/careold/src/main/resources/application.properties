server.port=${SUINING_PORT:8795}
server.address=${SUINING_BIND_ADDRESS:127.0.0.1}
suining.data-dir=${SUINING_DATA_DIR:${user.home}/.suining}
local-path=${IMAGE_STORAGE_PATH:${suining.data-dir}/images/}
spring.datasource.url=jdbc:h2:file:${suining.data-dir}/database/suining;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=${SUINING_DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.h2.console.enabled=false
server.compression.enabled=true
server.compression.mime-types=application/javascript,text/css,text/html,application/json
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
tencent.sms.app-id=${TENCENT_SMS_APP_ID:}
tencent.sms.app-key=${TENCENT_SMS_APP_KEY:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
